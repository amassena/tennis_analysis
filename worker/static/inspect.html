<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspect — per-video report</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#0a0a0b;color:#f5f5f7;padding:14px 14px 60px}
h1{font-size:1.15em;font-weight:800;color:#c7ff00}
.sub{color:#9aa0a6;font-size:.82em;margin:2px 0 14px}
.sub b{color:#f5f5f7}
.err{color:#ff6b6b;padding:20px;text-align:center}
input,button{font:inherit}
.bar{display:flex;gap:8px;margin-bottom:14px}
.bar input{flex:1;min-width:0;background:#141416;border:1px solid #2a2a2e;color:#f5f5f7;border-radius:8px;padding:9px 12px}
.bar button{background:#c7ff00;color:#0a0a0b;font-weight:700;border:0;border-radius:8px;padding:9px 14px}
section{margin-bottom:24px}
h2{font-size:.74em;text-transform:uppercase;letter-spacing:.09em;color:#9aa0a6;margin-bottom:9px;display:flex;gap:8px;align-items:center}
h2 .n{background:#1c1c1e;color:#c7ff00;border-radius:10px;padding:1px 8px;font-size:.95em;font-weight:700}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:#141416;border:1px solid #1f1f22;border-radius:10px;padding:10px 14px;min-width:96px}
.kpi .v{font-size:1.5em;font-weight:800}
.kpi .l{color:#9aa0a6;font-size:.72em;text-transform:uppercase;letter-spacing:.06em}
.coach{background:#101810;border-left:3px solid #3ddc84;border-radius:8px;padding:12px 14px;font-size:.92em;line-height:1.4}
.coach .hl{font-weight:700;color:#c7ff00;margin-bottom:6px}
video{width:100%;border-radius:8px;background:#000;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{background:#141416;border:1px solid #1f1f22;border-radius:10px;padding:10px;margin-bottom:10px}
.shot .hd{display:flex;justify-content:space-between;align-items:center;font-size:.82em;margin-bottom:7px}
.shot .ty{font-weight:700}
.shot .ty.forehand{color:#b07cd6}.shot .ty.backhand{color:#5fd493}.shot .ty.serve{color:#ffa64d}
.shot .meta{color:#9aa0a6;font-size:.92em}
.conf{font-variant-numeric:tabular-nums}
.conf.low{color:#ff8888}
.film{width:100%;border-radius:6px;display:block;margin-bottom:5px;background:#1c1c1e}
.tog{display:flex;gap:6px;margin-bottom:6px}
.tog button{flex:1;background:#1c1c1e;color:#9aa0a6;border:1px solid #2a2a2e;border-radius:6px;padding:4px;font-size:.72em}
.tog button.on{background:#2a2a2e;color:#c7ff00}
.cmp{border:1px solid #5a3b6b;border-radius:8px;padding:7px;margin-top:7px}
.cmp .lab{color:#c79bff;font-size:.72em;font-weight:700;margin-bottom:5px}
.empty{color:#5a5f65;font-size:.85em;padding:6px 2px}
.flag{background:#5a2020;color:#ff8888;border-radius:5px;padding:1px 6px;font-size:.68em;font-weight:700;margin-left:6px}
.fb{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;border-top:1px solid #1f1f22;padding-top:7px}
.fb button{background:#1c1c1e;color:#9aa0a6;border:1px solid #2a2a2e;border-radius:6px;padding:4px 9px;font-size:.72em}
.fb button:active{transform:scale(.96)}
.fb button.sent{background:#13361f;color:#3ddc84;border-color:#2f7d4f}
.fb button.good.sent{background:#13361f}
.fb .note{flex:1;min-width:120px;background:#0f0f10;border:1px solid #2a2a2e;color:#f5f5f7;border-radius:6px;padding:4px 8px;font-size:.75em}
details summary{cursor:pointer;color:#9aa0a6;font-size:.85em;padding:4px 0}
.thumb{width:100%;border-radius:8px;display:block;margin-bottom:10px;background:#1c1c1e}
.muted{color:#6a6f75}
</style>
</head><body>
<h1>Per-video Inspector</h1>
<div class="sub" id="sub">Enter a video id (e.g. iphone_9ca0a615). User hash defaults to yours.</div>
<div class="bar">
  <input id="vid" placeholder="video id (iphone_xxxxxxxx)" autocapitalize="off" autocorrect="off">
  <button onclick="go()">Load</button>
</div>
<div id="content"></div>

<script>
var BASE='https://tennis.playfullife.com';
function qp(k){return new URL(location.href).searchParams.get(k);}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad3(n){return String(n).padStart(3,'0');}

async function fetchJSON(url){
  var r=await fetch(url,{credentials:'include',cache:'no-store'});
  if(!r.ok) return null;
  try{return await r.json();}catch(e){return null;}
}
async function head(url){ try{var r=await fetch(url,{method:'HEAD',credentials:'include',cache:'no-store'}); return r.ok;}catch(e){return false;} }

function go(){
  var v=document.getElementById('vid').value.trim();
  if(!v) return;
  var u=qp('u')||'__SELF__';
  var url=new URL(location.href); url.searchParams.set('vid',v); if(qp('u'))url.searchParams.set('u',qp('u'));
  history.replaceState(null,'',url); load();
}

async function resolveUserHash(vid){
  // explicit ?u= wins; else discover from the upload marker via /api/queue-less path:
  if(qp('u')) return qp('u');
  // try the admin queue to find this vid's owner
  var d=await fetchJSON(BASE+'/api/admin/queue');
  if(d&&d.items){ var it=d.items.find(function(x){return x.video_id===vid;}); if(it&&it.user_hash) return it.user_hash; }
  return null;
}

async function load(){
  var vid=qp('vid'); var c=document.getElementById('content');
  if(!vid){ c.innerHTML=''; return; }
  document.getElementById('vid').value=vid;
  c.innerHTML='<div class="muted">Loading '+esc(vid)+'…</div>';

  var uh=await resolveUserHash(vid);
  if(!uh){ c.innerHTML='<div class="err">Could not resolve user for '+esc(vid)+'. Add ?u=u_xxxx to the URL, or sign in as admin.</div>'; return; }
  var P=BASE+'/u/'+uh+'/'+vid+'/';           // per-user asset prefix
  document.getElementById('sub').innerHTML='<b>'+esc(vid)+'</b> · user <b>'+esc(uh)+'</b>';

  var meta=await fetchJSON(P+'meta.json');
  var shots=await fetchJSON(P+'shots.json');
  var coaching=await fetchJSON(P+'coaching.json');
  var cmpIdx=await fetchJSON(P+vid+'_comparisons_index.json');
  var cmpShots=(cmpIdx&&cmpIdx.shots)||[];

  var html='';

  // KPIs
  var bd=(meta&&meta.breakdown)||{};
  html+='<section><div class="kpis">'
    +kpi(meta?meta.shots:'—','shots')
    +kpi(meta&&meta.duration?Math.round(meta.duration)+'s':'—','duration')
    +Object.keys(bd).map(function(k){return kpi(bd[k],k);}).join('')
    +kpi(cmpShots.length,'comparisons')
    +'</div>';
  if(meta&&(meta.shots===0)) html+='<div class="empty">⚠️ 0 shots — would be hidden from the gallery.</div>';
  html+='</section>';

  // Timeline video + thumbnail
  html+='<section><h2>Timeline</h2>'
    +'<img class="thumb" src="'+BASE+'/u/'+uh+'/thumbs/'+vid+'.jpg" onerror="this.style.display=\'none\'">'
    +'<video controls preload="metadata" src="'+P+vid+'_timeline.mp4"></video></section>';

  // Coach
  if(coaching){
    html+='<section><h2>Coach</h2><div class="coach"><div class="hl">'+esc(coaching.headline||'')+'</div>';
    (coaching.strengths||[]).forEach(function(s){ html+='✅ <b>'+esc(s.point||'')+'</b> — '+esc(s.detail||'')+'<br>'; });
    (coaching.work_on||[]).forEach(function(s){ html+='🔧 <b>'+esc(s.point||'')+'</b> — '+esc(s.detail||'')+'<br>'; });
    html+='</div></section>';
  }

  // Per-shot: filmstrip + contact + comparison
  var sl=(shots&&shots.shots)||[];
  html+='<section><h2>Shots <span class="n">'+sl.length+'</span></h2>';
  if(!sl.length) html+='<div class="empty">no shots.json / 0 shots</div>';
  sl.forEach(function(s){
    var idx=s.idx, ty=s.type||'?', conf=s.confidence;
    var film=P+'sequences/shot_'+pad3(idx)+'_'+ty+'.jpg';
    var skel=P+'sequences/shot_'+pad3(idx)+'_'+ty+'_skel.jpg';
    var hasCmp=cmpShots.indexOf(idx)>=0;
    var lowConf = (conf!=null && conf<0.6);
    html+='<div class="shot"><div class="hd">'
      +'<span class="ty '+ty+'">#'+idx+' '+esc(ty)+'</span>'
      +'<span class="meta">t='+(s.t!=null?s.t.toFixed(1):'?')+'s · <span class="conf'+(lowConf?' low':'')+'">conf '+(conf!=null?conf.toFixed(2):'?')+'</span>'
      +(lowConf?'<span class="flag">LOW</span>':'')+(hasCmp?'<span class="flag" style="background:#3b2d5a;color:#c79bff">vs pro</span>':'')+'</span></div>';
    html+='<div class="tog"><button class="on" data-f="'+film+'" onclick="swap(this,0)">film</button>'
      +'<button data-s="'+skel+'" onclick="swap(this,1)">skeleton</button></div>';
    html+='<img class="film" src="'+film+'" loading="lazy" data-film="'+film+'" data-skel="'+skel+'" onerror="this.style.opacity=.3">';
    if(hasCmp){
      html+='<div class="cmp"><div class="lab">PRO COMPARISON</div>'
        +'<video controls preload="none" src="'+P+vid+'_comparison_shot_'+pad3(idx)+'.mp4"></video></div>';
    }
    // Feedback row — per-shot corrections feed a ground-truth loop.
    html+='<div class="fb" data-shot="'+idx+'">'
      +fbBtn(idx,'wrong_type','wrong type')
      +fbBtn(idx,'not_a_shot','not a shot')
      +fbBtn(idx,'contact_off','contact off')
      +(hasCmp?fbBtn(idx,'bad_comparison','bad compare'):'')
      +fbBtn(idx,'good','👍')
      +'<input class="note" placeholder="note… (Enter to send)" onkeydown="if(event.key===\'Enter\'){sendFb('+idx+',\'note\',this.value);this.value=\'\';}">'
      +'</div>';
    html+='</div>';
  });
  html+='</section>';

  c.innerHTML=html;

  // Mark buttons that already have feedback from a prior session.
  var fb=await fetchJSON(BASE+'/api/inspect/'+encodeURIComponent(vid)+'/feedback');
  if(fb&&fb.entries){
    fb.entries.forEach(function(e){
      var row=c.querySelector('.fb[data-shot="'+e.shot_idx+'"]');
      if(row){ var b=row.querySelector('button[data-kind="'+e.kind+'"]'); if(b) b.classList.add('sent'); }
    });
  }
}

function fbBtn(idx,kind,label){
  return '<button data-kind="'+kind+'" class="'+kind+'" onclick="sendFb('+idx+',\''+kind+'\')">'+esc(label)+'</button>';
}

async function sendFb(shotIdx, kind, note){
  var vid=qp('vid'); if(!vid) return;
  var row=document.querySelector('.fb[data-shot="'+shotIdx+'"]');
  try{
    var r=await fetch(BASE+'/api/inspect/'+encodeURIComponent(vid)+'/feedback',{
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({kind:kind, shot_idx:shotIdx, note:note||''})
    });
    if(r.ok && row){ var b=row.querySelector('button[data-kind="'+kind+'"]'); if(b){ b.classList.add('sent'); b.textContent=b.textContent.replace(/ ✓$/,'')+' ✓'; } }
    else if(!r.ok){ alert('Feedback failed: HTTP '+r.status+(r.status===403?' (sign in as owner/admin)':'')); }
  }catch(e){ alert('Feedback error: '+e); }
}

function swap(btn,toSkel){
  var film=btn.closest('.shot').querySelector('.film');
  film.src = toSkel ? film.dataset.skel : film.dataset.film;
  btn.parentNode.querySelectorAll('button').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
}
function kpi(v,l){return '<div class="kpi"><div class="v">'+esc(String(v))+'</div><div class="l">'+esc(l)+'</div></div>';}

load();
</script>
</body></html>
