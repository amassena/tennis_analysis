<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Tennis Uploader</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 460px;
      margin: 0 auto;
      padding: 64px 24px 80px;
      color: #1c1c1e;
      background: #fff;
    }
    h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: -0.01em; }
    p { margin: 0 0 14px; color: #3a3a3c; }
    .lede { color: #1c1c1e; font-size: 17px; }
    form { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 13px; color: #6b7280; }
    input[type=email] {
      width: 100%; box-sizing: border-box;
      padding: 12px 14px; border-radius: 10px; border: 1px solid #d2d2d7;
      font-size: 16px; background: #fff; color: #1c1c1e;
    }
    input[type=email]:focus { outline: 2px solid #0a84ff; outline-offset: -1px; border-color: transparent; }
    button {
      padding: 12px 14px; border-radius: 10px; border: 0;
      background: #0a84ff; color: #fff; font-weight: 600; font-size: 16px;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.6; cursor: progress; }
    .msg { font-size: 14px; min-height: 1.5em; margin-top: 8px; }
    .msg.ok { color: #1e8b3a; }
    .msg.err { color: #b00020; }
    .footer { margin-top: 32px; color: #6b7280; font-size: 13px; }
    .secondary { color: #6b7280; font-size: 14px; margin-top: 28px; }
    a { color: #0a84ff; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f5f5f7; }
      p, label { color: #c7c7cc; }
      .lede { color: #f5f5f7; }
      input[type=email] { background: #1c1c1e; color: #f5f5f7; border-color: #3a3a3c; }
      .footer, .secondary { color: #9aa0a6; }
      .msg.ok { color: #4cd964; }
      .msg.err { color: #ff453a; }
    }
  </style>
</head>
<body>
  <h1>Tennis Uploader</h1>
  <p class="lede">Personal tennis-video analysis. Your gallery is private to you.</p>

  <form id="magic-form">
    <label for="email">Your email</label>
    <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" />
    <button type="submit" id="submit-btn">Email me a sign-in link</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="secondary">
    Or open the Tennis Uploader iOS app — same account either way.
  </p>

  <p class="footer">
    <a href="/privacy">Privacy</a> · <a href="/support">Support</a>
  </p>

  <script>
    var form = document.getElementById('magic-form');
    var btn = document.getElementById('submit-btn');
    var msg = document.getElementById('msg');
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      if (!email) return;
      btn.disabled = true; btn.textContent = 'Sending…';
      msg.className = 'msg'; msg.textContent = '';
      try {
        var resp = await fetch('/api/auth/magic/request', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({email: email}),
        });
        var data = await resp.json().catch(function(){ return {}; });
        if (resp.ok) {
          msg.className = 'msg ok';
          msg.textContent = data.message || 'Check your inbox.';
          btn.textContent = 'Sent — check your email';
        } else {
          msg.className = 'msg err';
          msg.textContent = data.detail || data.error || ('Error: ' + resp.status);
          btn.disabled = false; btn.textContent = 'Email me a sign-in link';
        }
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = 'Network error. Try again.';
        btn.disabled = false; btn.textContent = 'Email me a sign-in link';
      }
    });
  </script>
</body>
</html>
